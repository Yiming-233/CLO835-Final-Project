########################################################
# Tasks 2 and 6 - MySQL StatefulSet and PVCs
# Task 3 - Generate per-Pod MySQL configuration
# Task 4 - Clone data and configure asynchronous replication
########################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ${NAMESPACE}
spec:
  selector:
    matchLabels: {app: mysql}
  serviceName: mysql-h
  replicas: 3
  template:
    metadata:
      labels: {app: mysql}
    spec:
      initContainers:
      - name: init-mysql
        image: mysql:8.0
        command: ["bash", "/mnt/config-map/init-config.sh"]
        volumeMounts:
        - name: conf
          mountPath: /mnt/conf.d
        - name: config-map
          mountPath: /mnt/config-map
          
      - name: clone-mysql
        image: mysql:8.0
        command: ["bash", "/mnt/config-map/clone.sh"]
        env:
        - name: REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: replication-password
        volumeMounts:
        - {name: config-map, mountPath: /mnt/config-map}
        - {name: data, mountPath: /var/lib/mysql, readOnly: true}
        - {name: clone, mountPath: /clone}

      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: root-password
        - name: REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: replication-password
        ports:
        - name: mysql
          containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: conf
          mountPath: /etc/mysql/conf.d
        - name: config-map
          mountPath: /docker-entrypoint-initdb.d/primary.sh
          subPath: primary.sh
        - name: clone
          mountPath: /docker-entrypoint-initdb.d/10-clone.sql
          subPath: clone.sql
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1"
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 3

      - name: replication
        image: mysql:8.0
        command: ["bash", "/mnt/config-map/replica.sh"]
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: root-password
        - name: REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: replication-password
        volumeMounts:
        - name: config-map
          mountPath: /mnt/config-map
        - name: clone
          mountPath: /clone
          readOnly: true
        - name: data
          mountPath: /var/lib/mysql
      volumes:
      - name: config-map
        configMap:
          name: mysql-config
      - name: conf
        emptyDir: {}
      - name: clone
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: standard
      resources: {requests: {storage: 1Gi}}