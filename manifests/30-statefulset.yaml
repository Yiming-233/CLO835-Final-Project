########################################################
# Tasks 2 and 6 - MySQL StatefulSet and PVCs
# Task 3 - Generate per-Pod MySQL configuration
# Task 4 - Clone data and configure asynchronous replication
########################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ${NAMESPACE}
spec:
  serviceName: mysql-h
  replicas: 3
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      initContainers:
      - name: init-config
        image: mysql:8.0
        command: ["bash", "/mnt/config/init-config.sh"]
        volumeMounts:
        - {name: config, mountPath: /mnt/config}
        - {name: generated-config, mountPath: /mnt/generated}
      - name: clone-mysql
        image: mysql:8.0
        command: ["bash", "/mnt/config/clone.sh"]
        env:
        - name: REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: replication-password
        volumeMounts:
        - {name: config, mountPath: /mnt/config}
        - {name: data, mountPath: /var/lib/mysql, readOnly: true}
        - {name: clone, mountPath: /clone}

      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: root-password
        - name: REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: replication-password
        ports:
        - {name: mysql, containerPort: 3306}
        volumeMounts:
        - {name: data, mountPath: /var/lib/mysql}
        - {name: generated-config, mountPath: /etc/mysql/conf.d}
        - name: config
          mountPath: /docker-entrypoint-initdb.d/primary.sh
          subPath: primary.sh
        - name: clone
          mountPath: /docker-entrypoint-initdb.d/10-clone.sql
          subPath: clone.sql
        readinessProbe:
          exec:
            command:
            - bash
            - -c
            - mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1"
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 3
      - name: replication
        image: mysql:8.0
        command: ["bash", "/mnt/config/replica.sh"]
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: root-password
        - name: REPLICATION_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${SECRET_NAME}
              key: replication-password
        volumeMounts:
        - {name: config, mountPath: /mnt/config, readOnly: true}
        - {name: clone, mountPath: /clone, readOnly: true}
        - {name: data, mountPath: /var/lib/mysql}
      volumes:
      - name: config
        configMap:
          name: mysql-config
      - name: generated-config
        emptyDir: {}
      - name: clone
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: standard
      resources: {requests: {storage: 1Gi}}