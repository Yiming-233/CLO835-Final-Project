########################################################
# Tasks 4 and 7 - MySQL Configuration and Replication Scripts
# Adapted from the Kubernetes replicated MySQL tutorial
########################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: ${NAMESPACE}
data:
  # CNF files are MySQL settings; scripts below are Bash with embedded SQL.
  # Only the initial role is chosen here; promotion is manual in runbook.md.
  primary.cnf: |
    [mysqld]
    # Record changes in binary logs so replicas can request them.
    log-bin

  replica.cnf: |
    [mysqld]
    # Record changes in binary logs so replicas can request them.
    log-bin
    # Ordinary clients cannot write; root still can for database initialization.
    read-only
 
  clone.sh: |
    #!/bin/bash
    set -eu

    # Prepare the SQL file for mounting
    touch /clone/clone.sql

    # Skip the clone if data already exists, following the tutorial
    if [[ -d /var/lib/mysql/mysql ]]; then
      exit 0
    fi

    # Skip the clone on primary (ordinal index 0), following the tutorial
    if [[ $HOSTNAME =~ -([0-9]+)$ ]]; then
      ordinal=${BASH_REMATCH[1]}
    else
      exit 1
    fi

    if [[ $ordinal -eq 0 ]]; then
      exit 0
    fi

    # Wait until the primary accepts connections
    until mysql --connect-timeout=2 \
      -h mysql-0.mysql-h -urepl -p"$REPLICATION_PASSWORD" \
      -e "SELECT 1" >/dev/null; do
      sleep 2
    done

    # Save the database and replication position
    mysqldump -h mysql-0.mysql-h -urepl -p"$REPLICATION_PASSWORD" \
      --single-transaction --source-data=2 --no-tablespaces \
      --databases clo835 > /clone/clone.sql

    # Project adaptation: normalize the dump's replication statement
    sed -i 's/^-- CHANGE MASTER TO /-- CHANGE REPLICATION SOURCE TO /' /clone/clone.sql
    sed -i 's/MASTER_LOG_FILE/SOURCE_LOG_FILE/g' /clone/clone.sql
    sed -i 's/MASTER_LOG_POS/SOURCE_LOG_POS/g' /clone/clone.sql

  replica.sh: |
    #!/bin/bash
    set -eu

    # Extract the Pod ordinal, following the tutorial
    if [[ $HOSTNAME =~ -([0-9]+)$ ]]; then
      ordinal=${BASH_REMATCH[1]}
    else
      echo "Unexpected Pod hostname: $HOSTNAME" >&2
      exit 1
    fi

    # Skip replication setup on the initial primary (ordinal index 0)
    if [[ $ordinal -eq 0 ]]; then
      exec sleep infinity
    fi

    # Keep saved replication settings when the Pod restarts.
    if [[ -f /var/lib/mysql/.replication-configured ]]; then
      exec sleep infinity
    fi

    # Wait for the regular MySQL server, not its temporary init server
    until mysql --connect-timeout=2 \
      -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" \
      -e "SELECT 1" >/dev/null; do
      sleep 2
    done

    # Extract the coordinates and remove the ending semicolon
    coordinates=$(sed -n 's/^-- CHANGE REPLICATION SOURCE TO //p' /clone/clone.sql |
      sed 's/;$//')

    # Check if the coordinate is empty or not
    if [[ -z "$coordinates" ]]; then
      echo "Replication coordinates are missing from the dump." >&2
      exit 1
    fi

    # Start from the dump snapshot position, not the source's current position.
    # GET_SOURCE_PUBLIC_KEY supports the MySQL 8 password authentication method.
    mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL
    CHANGE REPLICATION SOURCE TO
      ${coordinates},
      SOURCE_HOST='mysql-0.mysql-h',
      SOURCE_USER='repl',
      SOURCE_PASSWORD='${REPLICATION_PASSWORD}',
      SOURCE_CONNECT_RETRY=10,
      GET_SOURCE_PUBLIC_KEY=1;
    START REPLICA;
    SQL

    # Persist the setup marker on the database PVC
    # sleep infinity keeps this regular helper alive without redoing setup.
    touch /var/lib/mysql/.replication-configured
    exec sleep infinity