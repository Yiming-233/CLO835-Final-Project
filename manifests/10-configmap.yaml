########################################################
# Tasks 3 and 7 - MySQL Configuration and Init Script
# Adapted from the Kubernetes replicated MySQL tutorial
########################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: ${NAMESPACE}
data:
  primary.cnf: |
    [mysqld]
    log-bin=mysql-bin

  replica.cnf: |
    [mysqld]
    log-bin=mysql-bin
    read-only=ON

  init-config.sh: |
    #!/bin/bash
    set -eu

    # Generate server-id from the Pod ordinal
    [[ $HOSTNAME =~ -([0-9]+)$ ]] || exit 1
    ordinal=${BASH_REMATCH[1]}

    echo "[mysqld]" > /mnt/conf.d/server-id.cnf
    echo "server-id=$((100 + $ordinal))" >> /mnt/conf.d/server-id.cnf

    # Copy the configuration for the initial Pod role
    if [[ $ordinal -eq 0 ]]; then
      cp /mnt/config-map/primary.cnf /mnt/conf.d/
    else
      cp /mnt/config-map/replica.cnf /mnt/conf.d/
    fi
  
  primary.sh: |
    #!/bin/bash
    set -eu

    # Create the replication account only on the initial primary
    if [[ "$HOSTNAME" == "mysql-0" ]]; then
      mysql -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL
    CREATE DATABASE IF NOT EXISTS clo835;
    CREATE USER IF NOT EXISTS 'repl'@'%' IDENTIFIED BY '${REPLICATION_PASSWORD}';
    GRANT REPLICATION SLAVE, REPLICATION CLIENT, RELOAD ON *.* TO 'repl'@'%';
    GRANT SELECT, SHOW VIEW, TRIGGER ON clo835.* TO 'repl'@'%';
    SQL
    fi
  
  clone.sh: |
    #!/bin/bash
    set -eu

    # Prepare the file for the later import step
    touch /clone/clone.sql

    # Skip cloning if database files already exist
    [[ -d /var/lib/mysql/mysql ]] && exit 0

    # Skip cloning on the primary
    [[ $HOSTNAME =~ -([0-9]+)$ ]] || exit 1
    ordinal=${BASH_REMATCH[1]}
    [[ $ordinal -eq 0 ]] && exit 0

    # Wait for the primary, following the tutorial loop structure
    until mysql --connect-timeout=2 \
      -h mysql-0.mysql-h -urepl -p"$REPLICATION_PASSWORD" \
      -e "SELECT 1" >/dev/null; do
      sleep 2
    done

    # Dump the project database and its replication coordinates
    mysqldump \
      -h mysql-0.mysql-h -urepl -p"$REPLICATION_PASSWORD" \
      --single-transaction \
      --source-data=2 \
      --no-tablespaces \
      --databases clo835 > /clone/clone.sql

  replica.sh: |
    #!/bin/bash
    set -eu

    [[ $HOSTNAME =~ -([0-9]+)$ ]] || exit 1
    ordinal=${BASH_REMATCH[1]}

    # Skip setup on the primary or an already configured replica
    if [[ $ordinal -eq 0 || -f /var/lib/mysql/.replication-configured ]]; then
      exec sleep infinity
    fi

    # Wait for the regular MySQL server, not its temporary init server
    until mysql --connect-timeout=2 \
      -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" \
      -e "SELECT 1" >/dev/null; do
      sleep 2
    done

    # Extract the binary log file and position recorded by mysqldump
    coordinates=$(sed -n -E \
      's/^-- CHANGE (REPLICATION SOURCE|MASTER) TO (.*);$/\2/p' \
      /clone/clone.sql |
      sed 's/MASTER_LOG_FILE/SOURCE_LOG_FILE/g; s/MASTER_LOG_POS/SOURCE_LOG_POS/g')

    if [[ -z "$coordinates" ]]; then
      echo "Replication coordinates are missing from the dump." >&2
      exit 1
    fi

    mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL
    CHANGE REPLICATION SOURCE TO
      ${coordinates},
      SOURCE_HOST='mysql-0.mysql-h',
      SOURCE_USER='repl',
      SOURCE_PASSWORD='${REPLICATION_PASSWORD}',
      SOURCE_CONNECT_RETRY=10,
      GET_SOURCE_PUBLIC_KEY=1;
    START REPLICA;
    SQL

    # Persist the setup marker on the database PVC
    touch /var/lib/mysql/.replication-configured
    exec sleep infinity