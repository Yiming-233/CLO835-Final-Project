########################################################
# Task 5 - Headless and Read Services
########################################################
apiVersion: v1
kind: Service
metadata:
  name: mysql-h
  namespace: ${NAMESPACE}
spec:
  ports:
  - name: mysql
    port: 3306
  clusterIP: None
  selector: {app: mysql}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-read
  namespace: ${NAMESPACE}
spec:
  ports:
  - name: mysql
    port: 3306
  selector: {app: mysql}