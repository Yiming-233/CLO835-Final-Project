########################################################
# Task 5 - Headless and Read Services
########################################################
apiVersion: v1
kind: Service
metadata:
  name: mysql-h
  namespace: ${NAMESPACE}
spec:
  clusterIP: None
  selector: {app: mysql}
  ports:
    - {port: 3306, targetPort: 3306}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-read
  namespace: ${NAMESPACE}
spec:
  selector: {app: mysql}
  ports:
    - {port: 3306, targetPort: 3306}